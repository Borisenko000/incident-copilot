spring:
  application:
    name: incident-copilot
  datasource:
    # Локальные значения по умолчанию; в других средах задаются переменными окружения
    url: ${DB_URL:jdbc:postgresql://localhost:5432/copilot}
    username: ${DB_USER:copilot}
    password: ${DB_PASSWORD:copilot}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always

copilot:
  ingestion:
    # Событие с тем же fingerprint привязывается к OPEN-инциденту, если тот был активен в этом окне
    correlation-window: PT30M
    # Лимит тела любого запроса (NFR-04); больше → 413
    max-payload-size: 16KB
