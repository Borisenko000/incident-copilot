# Локальная БД для разработки: docker compose up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: copilot-postgres
    environment:
      POSTGRES_DB: copilot
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
    ports:
      # только localhost: БД недоступна из сети; порт меняется через DB_PORT
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - copilot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  copilot-pgdata:
